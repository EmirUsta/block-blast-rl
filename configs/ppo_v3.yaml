# v3 — v2_parallel'in iki upgrade'i:
#   1) batch_size 256 → 1024  (rollout buffer 32K, daha az ama stabil update)
#   2) env: configs/env_v3.yaml — hole_penalty -0.5 (size<=2 izole boş ada başına)
#
# İki değişiklik aynı anda → A/B karşılaştırması v2 vs v3 (her ikisi birlikte).
# İleride hangisinin ne kadar katkı verdiğini ayrıştırmak için ablation gerekirse
# v3a (sadece batch=1024) ve v3b (sadece hole_penalty) yapılabilir.

algo: MaskablePPO
policy: MultiInputPolicy

policy_kwargs:
  features_dim: 256
  cnn_channels: [32, 64]
  history_embed_dim: 16

learning_rate: 3.0e-4
n_steps: 2048
batch_size: 1024            # was 256 (v2)
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.03

n_envs: 16
total_timesteps: 10_000_000

eval_freq: 25_000
n_eval_episodes: 20
checkpoint_freq: 100_000

env_config: configs/env_v3.yaml

tensorboard_log: logs/tensorboard
verbose: 1

seed: 44
device: auto
