# v6_jax_2048 — JAX GPU-resident env (BlockBlastBatchEnv yerine).
#
# Değişiklikler v5_batch64 → v6_jax_2048 (sadece backend + batch genişliği):
#   - Backend: BlockBlastBatchEnv (numpy) → JaxBlockBlastVecEnv (--use-jax)
#   - n_envs: 64 → 2048
#   - n_steps: 512 → 16     (rollout_size 32K SABİT — 64×512 = 2048×16)
#   - batch_size: 1024 (aynı, minibatch_count=32)
#
# Aynı tutulan (v5_batch64'ten):
#   - Mimari: 7-kanal early fusion + bottleneck CNN, ~347K param
#   - PPO: gamma=0.99 gae=0.95 clip=0.2 ent=0.01 vf=0.5 lr=3e-4
#         max_grad_norm=0.5 target_kl=0.03 n_epochs=10
#   - env_config: configs/env.yaml (sade survival)
#
# Beklenen wallclock 10M:
#   v5_batch64: 23.5 dk
#   v6_jax_2048: ~13 dk (PPO 200K bench: 5,480 → 10,256 ts/s = 1.87×)
#
# Eğitim komutu:
#   python -m src.scripts.train --config configs/ppo_v6_jax.yaml --use-jax \
#          --run-name v6_jax_2048 --total-timesteps 10000000

algo: MaskablePPO
policy: MultiInputPolicy

policy_kwargs:
  features_dim: 256
  cnn_channels: [32, 64]
  history_embed_dim: 16

learning_rate: 3.0e-4
n_steps: 16                   # was 512 (v5) — rollout 32K SABİT (64×512 = 2048×16)
batch_size: 1024              # aynı — minibatch count = 32
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.03

n_envs: 2048                  # was 64 → JAX GPU-resident batched
total_timesteps: 10_000_000

eval_freq: 25_000
n_eval_episodes: 20
checkpoint_freq: 100_000

env_config: configs/env.yaml
tensorboard_log: logs/tensorboard
verbose: 1

seed: 49
device: auto
