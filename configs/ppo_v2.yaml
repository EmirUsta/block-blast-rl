# v2_parallel — v1 ile aynı hyperparams, sadece n_envs=16 + SubprocVecEnv.
# Amaç: 16-core CPU paralelliğinin throughput'u arttırıp arttırmadığını ölçmek.

algo: MaskablePPO
policy: MultiInputPolicy

policy_kwargs:
  features_dim: 256
  cnn_channels: [32, 64]
  history_embed_dim: 16

learning_rate: 3.0e-4
n_steps: 2048
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.03

n_envs: 16                # was 8
total_timesteps: 10_000_000

eval_freq: 25_000
n_eval_episodes: 20
checkpoint_freq: 100_000

env_config: configs/env.yaml

tensorboard_log: logs/tensorboard
verbose: 1

seed: 43                  # different seed for independent run
device: auto
