# Survival-only env. Reward: +1 step, -10 game_over, -1 invalid.
# Diğer her şey 0 — line clear/combo/score asla reward'a girmez.

board:
  size: 8

tray:
  size: 3
  same_tray_unique: true

pieces:
  config_file: configs/pieces.yaml

episode:
  max_steps: 5000     # truncation; pratikte ulaşılmaz

reward:
  step: 1.0
  game_over: -10.0
  invalid_action: -1.0
  # Hole penalty — küçük (size <= hole_max_size) izole boş ada oluşturma cezası.
  # Default 0.0 → v1/v2 davranışı (kapalı). v3 için configs/env_v3.yaml kullan.
  hole_penalty: 0.0
  hole_max_size: 2
  # Bumpiness penalty — boş hücre 4-connected component sayısının artışı cezalandırılır.
  # Asimetrik (line clear sonrası azalma ödüllendirilmez).
  bumpiness_penalty: 0.0
  # Line clear ödülü — base * exp^(n-1). Default kapalı. v3'te 10.0 / 3.0.
  line_clear_base: 0.0
  line_clear_exp: 3.0
